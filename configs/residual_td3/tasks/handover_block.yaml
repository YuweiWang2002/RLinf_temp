# Handover Block task instance for the residual refinement workflow.

task:
  name: handover_block
  robotwin_task_name: handover_block
  env_type: robotwin

robotwin:
  env_config: examples/embodiment/config/robotwin_handover_block_openpi_pi05_eval.yaml
  runtime_bootstrap: auto
  robotwin_path: TODO
  assets_path: TODO

pi05:
  config: pi05_aloha_robotwin_handover
  checkpoint: /nfs/data3/rlinf_data/pytorch_checkpoint/model.safetensors
  norm_stats_path: /nfs/data3/rlinf_data/pytorch_checkpoint/handover_expert/norm_stats.json
  chunk_len: 50
  model_num_action_chunks: 50

action_space:
  base: qpos14
  intervention: endpose16
  qpos_dim: 14
  endpose_dim: 16
  gripper_indices:
    left: 6
    right: 13
  ee_indices:
    left_xyz: [0, 1, 2]
    left_quat_wxyz: [3, 4, 5, 6]
    right_xyz: [8, 9, 10]
    right_quat_wxyz: [11, 12, 13, 14]

stages:
  pregrasp:
    enabled: true
    intervention_enabled: false
    trigger:
      type: heuristic_gripper_chunk
      close_direction: lower
      close_threshold: 0.25
      closing_delta_threshold: 0.5
      cooldown_steps: 50
  handover:
    enabled: true
    intervention_enabled: true
    trigger:
      type: chunk_aware_learned_gate
  placement:
    enabled: true
    trigger:
      type: TODO
  scan:
    enabled: false
    trigger:
      type: none

gates:
  chunk_aware:
    checkpoint: logs/chunk_aware_gate/full/gate_head/chunk_aware_gate_head.pt
    threshold: 0.6
    chunk_len: 50
  labels:
    source: /nfs/data3/rlinf_data/lerobot_cache/huggingface/lerobot/handover_expert_with_gate/
    weak_supervision: true

intervention:
  stage: handover
  horizon_k: 50
  execution_mode: ee
  execution_strategy: pointwise
  qpos_execution_enabled: false
  ee_execution_enabled: true
  delta_max: 0.05
  residual:
    enabled: false
    actor_type: zero
    actor_checkpoint: TODO
    scale: 1.0

replay:
  action_source: zero
  reward_mode: sparse_success
  max_steps: 600
  seed: 100100000
  seed_list: TODO
  hard_seed_set: logs/hard_eval_v1/hard_seeds.json

eval:
  normal:
    num_episodes: 20
  hard:
    seed_json: logs/hard_eval_v1/hard_seeds.json
    num_episodes: 50
  actionable:
    seed_json: logs/hard_eval_v1/failure_review/actionable/hard_seeds.json
  videos:
    enabled: false
    fps: 10
    source: third_view
  cleanup_policy: keep_summary_and_selected_videos

rollout:
  execution_mode: gate_controlled_hybrid
  save_dir: logs/residual_td3/handover_block/eval/config_smoke

logging:
  root: logs/residual_td3
  run_name: config_smoke
